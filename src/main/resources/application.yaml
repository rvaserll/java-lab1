spring:
  application:
    name: java-lab1
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/cosmo_cats}
    username: ${DB_USERNAME:cosmo_cats}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

market:
  security:
    api-key: ${MARKET_API_KEY:}
    issuer: ${JWT_ISSUER:http://localhost:8090}
    jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8090/.well-known/jwks.json}
    audience: ${JWT_AUDIENCE:cosmo-cats-api}
