# Adapted from the instructor's PR #1; execute checks explicitly.
name: Build and Test Coverage

on:
  pull_request:
  push:
    branches: [lab2-testing, lab3-databases]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build, test and verify coverage
        run: ./gradlew clean build --no-daemon --console=plain
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-report
          path: |
            build/reports/tests/test/
            build/reports/coverage/
          if-no-files-found: error
